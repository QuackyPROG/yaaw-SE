  "skills": {
    "yaaw-orchestrator": {"role":"orchestrator","requested_workflow":"orchestration.route","desired_outcome":"CONTINUE","completion_kind":"CONTINUE_UNTIL_STOP","description":"Continue or recover by reconstructing reality and dispatching the next safe workflow."},
    "yaaw-prd": {"role":"prd","requested_workflow":"prd.route","desired_outcome":"CONTINUE_PRODUCT","completion_kind":"PRODUCT_READY","description":"Create or continue product definition."},
    "yaaw-revise-prd": {"role":"prd","requested_workflow":"prd.revise","desired_outcome":"REVISE_PRODUCT","completion_kind":"PRODUCT_REVISION_ADVANCED","description":"Change accepted product intent and invalidate stale downstream contracts."},
    "yaaw-refine-prd": {"role":"prd","requested_workflow":"prd.refine","desired_outcome":"REFINE_PRODUCT","completion_kind":"PRODUCT_REFINED","description":"Improve product clarity without changing accepted meaning."},
