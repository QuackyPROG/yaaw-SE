    "yaaw-create-ticket": {"role":"planner","requested_workflow":"planning.create-tickets","desired_outcome":"CREATE_TICKETS","completion_kind":"CURRENT_TICKETS_REGISTERED","description":"Create bounded implementation tickets."},
