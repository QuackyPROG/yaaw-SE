    "yaaw-repair": {"role":"implementer","requested_workflow":"implementation.repair-ticket","desired_outcome":"REPAIR","completion_kind":"TICKET_REVIEW_REQUIRED","description":"Repair one REPAIR_REQUIRED ticket."},
    "yaaw-review": {"role":"reviewer","requested_workflow":"review.review-ticket","desired_outcome":"REVIEW","completion_kind":"TICKET_REVIEW_APPLIED","description":"Independently review implementation and classify its result."}
