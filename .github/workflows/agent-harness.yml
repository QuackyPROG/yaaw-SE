name: Agent Harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation-only dependencies
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Validate registered agent assets
        run: python scripts/validate_agent_assets.py
      - name: Validate Codex skill metadata budget
        run: python scripts/validate_skill_metadata.py
      - name: Validate cross-file semantics
        run: python scripts/validate_semantics.py
      - name: Validate structured schemas and fixtures
        run: python scripts/validate_schemas.py
      - name: Require current durable artifact schemas
        run: python scripts/validate_schema_versions.py
      - name: Validate runtime adapter registry
        run: python scripts/validate_runtime_adapters.py
      - name: Validate Codex runtime adapter
        run: python scripts/validate_codex_runtime.py
      - name: Validate generic command runtime adapter
        run: python scripts/validate_generic_command_runtime.py
      - name: Validate workflow graph and artifact documents
        run: python scripts/validate_workflow_state.py
      - name: Lint deterministic repository policy
        run: python scripts/yaaw_cli.py policy-lint
      - name: Run harness unit tests
        run: python -m unittest discover -s tests/harness -p 'test_*.py'
      - name: Run adversarial harness evaluations
        run: python scripts/run_evals.py
      - name: Run deterministic agent-loop evaluation fixture
        run: python scripts/run_agent_evals.py --manifest evals/agent-loop-fixture.json --adapter fake
      - name: Run synthetic workload comparison fixture
        run: python scripts/run_workload_compare.py --workload evals/workloads/synthetic-local.json --simulate
      - name: Verify scope checker fixtures
        run: python scripts/verify_task_scope.py --self-test
