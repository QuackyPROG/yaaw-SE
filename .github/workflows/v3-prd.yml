name: v3 PRD runtime checks
on:
  push:
    branches: [yaaw-SEv3]
  pull_request:
    branches: [yaaw-SEv3]
jobs:
  prd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check src/prd-engine.mjs && node --check src/prd-session.mjs && node --check src/codex-worker.mjs && node --check bin/yaaw-prd.mjs
      - name: CLI smoke without AI runtime
        run: |
          dir="$(mktemp -d)"
          node bin/yaaw-prd.mjs start --workspace "$dir"
          node bin/yaaw-prd.mjs status --workspace "$dir"
          node bin/yaaw-prd.mjs recover --workspace "$dir"
