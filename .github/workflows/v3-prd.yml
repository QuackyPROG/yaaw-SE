name: v3 PRD prototype checks
on:
  push:
    branches: [yaaw-SEv3]
  pull_request:
    branches: [yaaw-SEv3]
jobs:
  prd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check src/prd-engine.mjs && node --check bin/yaaw-prd.mjs
