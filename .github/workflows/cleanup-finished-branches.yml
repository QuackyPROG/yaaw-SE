name: Cleanup finished branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'QuackyPROG/yaaw-SE'
    runs-on: ubuntu-latest
    steps:
      - name: Delete finished branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            "impl/framework-immutability-runtime-hardening" \
            "impl/main-framework-immutability-recovery" \
            "promote/framework-immutability-main"
          do
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done

      - name: Verify only main and yaaw-SEv2 remain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches" --jq '.[].name' | sort)
          printf '%s\n' "${branches[@]}"
          expected=$'main\nyaaw-SEv2'
          actual="$(printf '%s\n' "${branches[@]}")"
          test "${actual}" = "${expected}"
