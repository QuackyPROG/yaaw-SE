name: Validate YAAW Core and Distribution

on:
  push:
    branches: [main, yaaw-SEv2]
  pull_request:
    paths:
      - '.yaaw-core/**'
      - 'skills/**'
      - 'scripts/**'
      - 'src/**'
      - 'installer/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'AGENTS.md'
      - 'README.md'

concurrency:
  group: yaaw-validate-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate semantic core
        run: |
          python scripts/validate_core.py
          python scripts/validate_behavior.py
          python scripts/behavior_oracle.py
          python scripts/validate_distribution.py
          python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Validate schemas
        run: npm run validate:schemas

      - name: Test npm installer
        run: npm test

      - name: Build npm payload
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Smoke exact packed tarball
        run: node scripts/smoke_npm_tarball.mjs

      - name: Smoke tarball-to-tarball update
        run: node scripts/smoke_npm_update.mjs

  node-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.0'
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Build at minimum supported Node version
        run: npm run build
      - name: Smoke exact package at minimum supported Node version
        run: node scripts/smoke_npm_tarball.mjs

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Build npm package
        run: npm run build
      - name: Run installer unit/integration tests
        run: npm run test:cli
      - name: Smoke exact packed tarball
        run: node scripts/smoke_npm_tarball.mjs

  publish-next:
    name: Publish npm prerelease (next)
    needs: [validate, node-floor, platform-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Confirm commit is current branch head
        id: freshness
        shell: bash
        run: |
          CURRENT_HEAD="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${CURRENT_HEAD}" = "${GITHUB_SHA}" ]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping stale commit ${GITHUB_SHA}; current branch head is ${CURRENT_HEAD}."
          fi

      - name: Resolve immutable prerelease version
        if: steps.freshness.outputs.publish == 'true'
        id: version
        shell: bash
        run: |
          REPO_VERSION="$(node -p "require('./package.json').version")"
          LATEST_JSON="$(npm view yaaw-se@latest version --json 2>/dev/null || true)"
          TARGET_VERSION="$(node scripts/resolve_release_version.mjs next "${REPO_VERSION}" "${LATEST_JSON}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}")"
          npm version "${TARGET_VERSION}" --no-git-tag-version
          echo "target=${TARGET_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Publishing yaaw-se@${TARGET_VERSION} to dist-tag next"

      - name: Build, smoke, and pack prerelease
        if: steps.freshness.outputs.publish == 'true'
        id: pack
        shell: bash
        run: |
          npm run build
          PACK_JSON="$(npm pack --json --ignore-scripts)"
          TARBALL="$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(p[0].filename)' "${PACK_JSON}")"
          YAAW_SMOKE_TARBALL="${PWD}/${TARBALL}" node scripts/smoke_npm_tarball.mjs
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"

      - name: Publish tested tarball to npm next
        if: steps.freshness.outputs.publish == 'true'
        run: npm publish "${{ steps.pack.outputs.tarball }}" --tag next --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify prerelease reached npm next
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          TARGET="${{ steps.version.outputs.target }}"
          for attempt in {1..36}; do
            PUBLISHED="$(npm view "yaaw-se@${TARGET}" version 2>/dev/null || true)"
            TAG="$(npm view yaaw-se@next version 2>/dev/null || true)"
            if [ "${PUBLISHED}" = "${TARGET}" ] && [ "${TAG}" = "${TARGET}" ]; then
              echo "Verified npm next -> yaaw-se@${TARGET}"
              exit 0
            fi
            echo "Waiting for npm next propagation (${attempt}/36): version=${PUBLISHED:-missing} tag=${TAG:-missing} target=${TARGET}"
            sleep 10
          done
          echo "npm publish returned success but yaaw-se@${TARGET} / next was not observable from the registry." >&2
          exit 1

  publish-release:
    name: Publish npm stable release (latest)
    needs: [validate, node-floor, platform-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Confirm commit is current main head
        id: freshness
        shell: bash
        run: |
          CURRENT_HEAD="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${CURRENT_HEAD}" = "${GITHUB_SHA}" ]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping stale commit ${GITHUB_SHA}; current main head is ${CURRENT_HEAD}."
          fi

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Resolve immutable stable version
        if: steps.freshness.outputs.publish == 'true'
        id: version
        shell: bash
        run: |
          REPO_VERSION="$(node -p "require('./package.json').version")"
          LATEST_JSON="$(npm view yaaw-se@latest version --json 2>/dev/null || true)"
          TARGET_VERSION="$(node scripts/resolve_release_version.mjs stable "${REPO_VERSION}" "${LATEST_JSON}")"
          npm version "${TARGET_VERSION}" --no-git-tag-version
          echo "target=${TARGET_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Stable target: yaaw-se@${TARGET_VERSION}"

      - name: Build, smoke, and pack stable release
        if: steps.freshness.outputs.publish == 'true'
        id: pack
        shell: bash
        run: |
          npm run build
          PACK_JSON="$(npm pack --json --ignore-scripts)"
          TARBALL="$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(p[0].filename)' "${PACK_JSON}")"
          YAAW_SMOKE_TARBALL="${PWD}/${TARBALL}" node scripts/smoke_npm_tarball.mjs
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"

      - name: Publish tested tarball to npm latest
        if: steps.freshness.outputs.publish == 'true'
        run: npm publish "${{ steps.pack.outputs.tarball }}" --tag latest --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify stable release reached npm latest
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          TARGET="${{ steps.version.outputs.target }}"
          for attempt in {1..36}; do
            PUBLISHED="$(npm view "yaaw-se@${TARGET}" version 2>/dev/null || true)"
            TAG="$(npm view yaaw-se@latest version 2>/dev/null || true)"
            if [ "${PUBLISHED}" = "${TARGET}" ] && [ "${TAG}" = "${TARGET}" ]; then
              echo "Verified npm latest -> yaaw-se@${TARGET}"
              exit 0
            fi
            echo "Waiting for npm latest propagation (${attempt}/36): version=${PUBLISHED:-missing} tag=${TAG:-missing} target=${TARGET}"
            sleep 10
          done
          echo "npm publish returned success but yaaw-se@${TARGET} / latest was not observable from the registry." >&2
          exit 1
