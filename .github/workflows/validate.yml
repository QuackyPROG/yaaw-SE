name: Validate YAAW Core

on:
  push:
    branches: [main, yaaw-SEv2]
  pull_request:
    paths:
      - '.yaaw-core/**'
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'WORKFLOW.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate contracts, manifests, schemas, and templates
        run: python scripts/validate_core.py
      - name: Validate lifecycle behavior
        run: python scripts/validate_behavior.py
      - name: Run lifecycle fixture oracle
        run: python scripts/behavior_oracle.py
      - name: Run contract and behavioral tests
        run: python -m unittest discover -s tests -v
