name: Validate YAAW Core

on:
  push:
    branches: [yaaw-SEv2]
  pull_request:
    paths:
      - '.yaaw-core/**'
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'AGENTS.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registries and structure
        run: python scripts/validate_core.py
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
