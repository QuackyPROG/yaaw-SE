name: Validate YAAW Core and Distribution

on:
  push:
    branches: [yaaw-SEv2]
  pull_request:
    paths:
      - '.yaaw-core/**'
      - 'skills/**'
      - 'scripts/**'
      - 'src/**'
      - 'installer/**'
      - 'tests/**'
      - 'docs/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'AGENTS.md'
      - 'README.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate semantic core
        run: |
          python scripts/validate_core.py
          python scripts/validate_behavior.py
          python scripts/behavior_oracle.py
          python scripts/validate_distribution.py
          python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm install --ignore-scripts

      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Test npm installer
        run: npm test

      - name: Build npm payload
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Smoke exact packed tarball
        run: node scripts/smoke_npm_tarball.mjs

      - name: Smoke tarball-to-tarball update
        run: node scripts/smoke_npm_update.mjs

  node-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.0'
      - name: Install Node dependencies
        run: npm install --ignore-scripts
      - name: Build at minimum supported Node version
        run: npm run build
      - name: Smoke exact package at minimum supported Node version
        run: node scripts/smoke_npm_tarball.mjs

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install --ignore-scripts
      - name: Build npm package
        run: npm run build
      - name: Run installer unit/integration tests
        run: npm run test:cli
      - name: Smoke exact packed tarball
        run: node scripts/smoke_npm_tarball.mjs
